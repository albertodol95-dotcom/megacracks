<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Megacracks 26/27 — Pablo, Raúl y Alberto</title>
<meta name="description" content="Seguimiento compartido de la colección Megacracks LaLiga 2026/27">
<meta name="theme-color" content="#EEF1F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1220" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Megacracks">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F6; --surface:#FFFFFF; --surface-2:#F6F8FB; --ink:#101828; --muted:#5B6476; --line:#D6DBE5;
  --accent:#2747FF; --accent-ink:#FFFFFF; --ok:#0FA36B; --warn:#E5484D;
  --slot:#E3E8F0; --slot-ink:#9AA3B5;
  --u-pablo:#0FA36B; --u-raul:#E8820C; --u-alberto:#8E4DFF;
  --display:"Big Shoulders Display", "Arial Narrow", sans-serif;
  --body:"Barlow", system-ui, sans-serif;
  --r-card:10px; --r-ui:14px;
  --nav-h:64px; --safe-b:env(safe-area-inset-bottom,0px);
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0D1220; --surface:#161D30; --surface-2:#1B2338; --ink:#EEF2FA; --muted:#97A1B6; --line:#283149;
    --accent:#7B8CFF; --accent-ink:#0D1220; --slot:#1A2236; --slot-ink:#56607A;
    --u-pablo:#34D399; --u-raul:#FBA94C; --u-alberto:#B18CFF;
    color-scheme: dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body{min-height:100dvh;padding-bottom:calc(var(--nav-h) + var(--safe-b) + 12px)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- Top bar ---------- */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top .wrap{display:flex;align-items:center;gap:12px;min-height:60px}
.brand{font-family:var(--display);font-weight:900;font-size:1.55rem;letter-spacing:.01em;line-height:1;white-space:nowrap}
.brand small{font-weight:600;color:var(--muted);font-size:.95rem;margin-left:4px}
.users{display:flex;gap:6px;margin-left:auto}
.user{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px 5px 5px;display:flex;align-items:center;gap:8px;font-weight:600;font-size:.95rem}
.user .av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:1rem;color:#fff;background:var(--uc)}
.user[aria-pressed="true"]{border-color:var(--uc);background:color-mix(in srgb,var(--uc) 14%,var(--surface))}
.sync{width:10px;height:10px;border-radius:50%;background:var(--slot-ink);flex:none}
.sync[data-s="ok"]{background:var(--ok)}
.sync[data-s="busy"]{background:var(--accent);animation:pulse 1s infinite}
.sync[data-s="off"]{background:var(--warn)}
@keyframes pulse{50%{opacity:.35}}
@media (max-width:560px){.user .nm{display:none}.user{padding:4px}.brand small{display:none}}

/* ---------- Hero progress ---------- */
.hero{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;align-items:end;padding:18px 0 10px}
.big{font-family:var(--display);font-weight:900;font-size:clamp(3.4rem,11vw,5.6rem);line-height:.82;letter-spacing:-.01em;color:var(--uc)}
.big span{font-size:.45em;color:var(--ink);margin-left:2px}
.hero-meta{padding-bottom:6px}
.hero-meta strong{font-family:var(--display);font-size:1.4rem;font-weight:800}
.hero-meta p{margin:0;color:var(--muted);font-size:.95rem}
.bar{grid-column:1/-1;height:10px;border-radius:99px;background:var(--slot);overflow:hidden;display:flex}
.bar i{display:block;height:100%;background:var(--uc);transition:width .4s ease}
.bar i.rep{background:color-mix(in srgb,var(--uc) 45%,transparent)}

/* ---------- Filters ---------- */
.filters{display:flex;flex-direction:column;gap:10px;padding:8px 0 14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.scroller{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0 4px;margin:0 -16px;padding-inline:16px}
.scroller::-webkit-scrollbar{display:none}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:600;font-size:.92rem;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip em{font-style:normal;color:var(--muted);font-weight:500;margin-left:4px}
.chip[aria-pressed="true"] em{color:inherit;opacity:.7}
.crest{flex:none;width:48px;border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.72rem;font-weight:700;color:var(--muted)}
.crest b{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:.95rem;letter-spacing:.02em;background:conic-gradient(var(--c1) 0 50%,var(--c2) 0 100%);color:transparent;position:relative;box-shadow:inset 0 0 0 2px rgba(0,0,0,.12)}
.crest b::after{content:attr(data-a);position:absolute;inset:6px;border-radius:50%;background:var(--surface);color:var(--ink);display:grid;place-items:center;font-size:.8rem}
.crest[aria-pressed="true"] b{outline:3px solid var(--accent);outline-offset:2px}
.crest .pc{font-variant-numeric:tabular-nums}
.search{flex:1 1 220px;min-width:0;border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r-ui);padding:9px 14px}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:var(--r-ui);overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:8px 12px;font-weight:600;font-size:.9rem}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

/* ---------- Album grid ---------- */
.sec-h{display:flex;align-items:baseline;gap:10px;margin:22px 0 10px}
.sec-h h2{font-family:var(--display);font-weight:800;font-size:1.6rem;margin:0;line-height:1}
.sec-h .n{color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.sec-h .done{color:var(--ok);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:12px}
@media (max-width:420px){.grid{grid-template-columns:repeat(3,1fr);gap:9px}}

.card{position:relative;aspect-ratio:5/7;border-radius:var(--r-card);border:0;padding:0;text-align:left;background:var(--slot);color:var(--slot-ink);overflow:visible;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.card .face{position:absolute;inset:0;border-radius:inherit;overflow:hidden;display:flex;flex-direction:column;padding:7px 8px}
.card[data-c="0"] .face{border:2px dashed color-mix(in srgb,var(--slot-ink) 55%,transparent)}
.card .no{font-family:var(--display);font-weight:900;font-size:1.9rem;line-height:.9;letter-spacing:-.01em;margin-top:auto}
.card .no small{font-size:.5em;font-weight:800;margin-left:2px}
.card .nm{font-weight:700;font-size:.8rem;line-height:1.15;margin-top:4px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.card .tm{font-size:.68rem;font-weight:600;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .stripe{height:6px;margin:-7px -8px 6px;background:linear-gradient(90deg,var(--c1) 0 60%,var(--c2) 60% 100%)}
.card .wm{position:absolute;left:0;right:0;top:22%;text-align:center;font-family:var(--display);font-weight:900;font-size:2.4rem;letter-spacing:.04em;opacity:.08;pointer-events:none}
.card .ed{position:absolute;top:10px;right:7px;font-size:.62rem;font-weight:800;padding:1px 5px;border-radius:5px;background:var(--ink);color:var(--bg)}

/* owned */
.card:not([data-c="0"]) .face{background:var(--surface);color:var(--ink);box-shadow:0 1px 0 rgba(16,24,40,.06),0 6px 16px -8px rgba(16,24,40,.35)}
.card:not([data-c="0"]) .no{color:var(--tc,var(--ink))}
/* duplicates: physical stack */
.card[data-r="1"]::before,.card[data-r="2"]::before{content:"";position:absolute;inset:0;border-radius:inherit;background:var(--surface);border:1px solid var(--line);transform:translate(4px,4px) rotate(2deg)}
.card[data-r="2"]::after{content:"";position:absolute;inset:0;border-radius:inherit;background:var(--surface);border:1px solid var(--line);transform:translate(8px,7px) rotate(4deg);z-index:-1}
.card[data-r] .face{z-index:1}
.badge{position:absolute;z-index:3;top:-7px;right:-7px;min-width:28px;height:28px;padding:0 7px;border-radius:99px;background:var(--uc);color:#fff;font-family:var(--display);font-weight:900;font-size:1rem;display:grid;place-items:center;box-shadow:0 0 0 3px var(--bg)}
.minus{position:absolute;z-index:3;top:-7px;left:-7px;width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:var(--surface);color:var(--ink);font-weight:800;font-size:1.1rem;line-height:1;display:grid;place-items:center;box-shadow:0 0 0 3px var(--bg)}
.card[data-c="0"] .minus{display:none}
.friends{position:absolute;z-index:3;bottom:6px;right:6px;display:flex;gap:3px}
.friends i{width:10px;height:10px;border-radius:50%;background:var(--fc);box-shadow:0 0 0 2px var(--surface)}
.card[data-c="0"] .friends i{box-shadow:0 0 0 2px var(--slot)}

/* tiers (only when owned the foil shows) */
.card:not([data-c="0"])[data-t="elite"] .face{background:linear-gradient(160deg,#FFF6D6,#F2C94C 45%,#B8861B);color:#3A2A00}
.card:not([data-c="0"])[data-t="power"] .face{background:conic-gradient(from 210deg at 70% 30%,#7CF7FF,#B98CFF,#FF8FD0,#FFE58F,#8FFFC1,#7CF7FF);color:#1A1030}
.card:not([data-c="0"])[data-t="enjoy"] .face{background:linear-gradient(160deg,#FF5FA2,#FF9A3C);color:#fff}
.card:not([data-c="0"])[data-t="vip"] .face{background:linear-gradient(160deg,#1C1C28,#3B2F5E);color:#F4E7FF}
.card:not([data-c="0"])[data-t="rookie"] .face{background:linear-gradient(160deg,#B8FF6A,#2CC28A);color:#08301F}
.card:not([data-c="0"])[data-t="stars"] .face{background:radial-gradient(circle at 30% 20%,#FFF 0 2%,transparent 3%),radial-gradient(circle at 70% 45%,#FFF 0 1.5%,transparent 2.5%),linear-gradient(160deg,#0B1B5C,#2747FF);color:#fff}
.card:not([data-c="0"])[data-t="j25"] .face{background:linear-gradient(160deg,#E9E9EE,#9EA3B0 50%,#F7F7FA);color:#1C1F2A}
.card:not([data-c="0"])[data-t="nf"] .face{background:linear-gradient(160deg,var(--surface) 55%,color-mix(in srgb,var(--accent) 22%,var(--surface)))}
.card:not([data-c="0"])[data-t="soch"] .face{background:linear-gradient(160deg,#F7F2E4,#D8C7A0);color:#3B2F12}
.card:not([data-c="0"])[data-t="sob"] .face{background:linear-gradient(160deg,#050505,#2A2A2A 60%,#0A0A0A);color:#E8E8E8}
.card:not([data-c="0"])[data-t="sog"] .face{background:linear-gradient(135deg,#7A5600,#F6D365 30%,#FFF3B0 45%,#C99A1E 65%,#7A5600);color:#2B1C00}
.card:not([data-c="0"])[data-t="edl"] .face{background:linear-gradient(160deg,#FF3B3B,#7A0019);color:#fff}
.card:not([data-c="0"])[data-t="ao"] .face{background:repeating-linear-gradient(-35deg,#FDFBF5 0 9px,#F3EEDF 9px 18px);color:#2A2414}
.card:not([data-c="0"])[data-t]:not([data-t="base"]):not([data-t="nf"]):not([data-t="custom"]) .no{color:inherit}
.card[data-t]:not([data-t="base"]) .tier-tag{font-size:.6rem;font-weight:800;letter-spacing:.02em;opacity:.85}

.card.bump .face{animation:bump .28s ease}
@keyframes bump{40%{transform:scale(1.07)}}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;font-family:var(--display);font-size:1.6rem;color:var(--ink);margin-bottom:4px}

/* ---------- Panels ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px}
.panel+.panel{margin-top:14px}
.two>.panel{margin-top:0}
.panel h2,.panel h3{font-family:var(--display);font-weight:800;margin:0 0 10px;line-height:1.05}
.panel h2{font-size:1.8rem}.panel h3{font-size:1.3rem}
.muted{color:var(--muted)}
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:700;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.sm{padding:6px 12px;font-size:.88rem}
.btn:disabled{opacity:.5}
.stack{display:flex;flex-direction:column;gap:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:760px){.two{grid-template-columns:1fr}}

/* Sobre */
.pack-in{display:flex;gap:8px;flex-wrap:wrap}
.pack-in input{flex:1 1 260px;font-size:1.25rem;font-family:var(--display);font-weight:800;letter-spacing:.02em;border:2px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--surface-2)}
.keys{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin-top:10px}
.keys button{border:1.5px solid var(--line);background:var(--surface-2);border-radius:10px;padding:10px 0;font-family:var(--display);font-weight:800;font-size:1.25rem}
.keys button.w{font-family:var(--body);font-size:.78rem;font-weight:700;overflow:hidden;text-overflow:ellipsis}
@media (min-width:761px){.keys{display:none}}
.reveal{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:14px;margin-top:16px;perspective:900px}
.reveal .slot{position:relative}
.reveal .card{animation:flip .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i) * 120ms)}
@keyframes flip{from{transform:rotateY(90deg) translateY(10px);opacity:0}to{transform:none;opacity:1}}
.verdict{text-align:center;font-family:var(--display);font-weight:900;font-size:1.15rem;margin-top:8px;animation:fade .3s both;animation-delay:calc(var(--i) * 120ms + 350ms)}
.verdict.new{color:var(--ok)} .verdict.rep{color:var(--muted)} .verdict.err{color:var(--warn)}
@keyframes fade{from{opacity:0}}
.reveal .slot.new .card .face::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.75) 50%,transparent 65%);transform:translateX(-120%);animation:sheen 1s ease both;animation-delay:calc(var(--i) * 120ms + 400ms)}
@keyframes sheen{to{transform:translateX(120%)}}
.summary{font-family:var(--display);font-weight:800;font-size:1.5rem;margin-top:14px}

/* lists */
.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:62px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .code{font-family:var(--display);font-weight:900;font-size:1.25rem;border-left:4px solid var(--tc,var(--line));padding-left:8px;line-height:1.1}
.li .who{font-weight:600;line-height:1.2}
.li .who small{display:block;color:var(--muted);font-weight:500}
.step{display:inline-flex;align-items:center;gap:6px}
.step button{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface-2);font-weight:800}
.step b{min-width:30px;text-align:center;font-family:var(--display);font-size:1.25rem}
.tag{font-size:.75rem;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line)}

/* ranking */
.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:640px){.podium{grid-template-columns:1fr}.pl{display:grid;grid-template-columns:1fr auto;align-items:end;column-gap:12px}.pl .pos{grid-column:1/-1}.pl .pct{font-size:2.4rem}.pl dl{grid-column:1/-1;grid-template-columns:repeat(4,auto);gap:0 8px}.pl dt{font-size:.78rem}.pl dd{text-align:left;grid-row:2}}
.pl{border-radius:18px;padding:16px;background:color-mix(in srgb,var(--uc) 12%,var(--surface));border:2px solid color-mix(in srgb,var(--uc) 40%,transparent)}
.pl .pos{font-family:var(--display);font-weight:900;font-size:1rem;color:var(--uc)}
.pl .nm{font-family:var(--display);font-weight:900;font-size:2rem;line-height:1}
.pl .pct{font-family:var(--display);font-weight:900;font-size:3rem;line-height:1;color:var(--uc)}
.pl dl{display:grid;grid-template-columns:1fr auto;margin:10px 0 0;gap:2px 10px;font-size:.92rem}
.pl dt{color:var(--muted)} .pl dd{margin:0;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
table.secs{width:100%;border-collapse:collapse;font-size:.92rem}
table.secs th,table.secs td{padding:8px 6px;border-top:1px solid var(--line);text-align:left}
table.secs th{font-weight:700}
table.secs td.u{width:24%}
.mini{height:6px;border-radius:99px;background:var(--slot);overflow:hidden;margin-top:3px}
.mini i{display:block;height:100%;background:var(--uc)}
.mini-l{font-variant-numeric:tabular-nums;font-weight:600;font-size:.82rem}

/* forms */
.f{display:flex;flex-direction:column;gap:4px;font-size:.88rem;font-weight:600}
.f input,.f select{border:1.5px solid var(--line);border-radius:10px;padding:9px 10px;background:var(--surface-2);font-weight:500;font-size:1rem}
.grid-f{display:grid;grid-template-columns:110px 1fr;gap:10px}
.switch{display:flex;gap:10px;align-items:center;font-weight:600}
.switch input{width:20px;height:20px;accent-color:var(--accent)}

/* bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h)}
nav.tabs button{position:relative;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:700;font-size:.78rem;color:var(--muted)}
nav.tabs svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--uc)}
nav.tabs .cnt{position:absolute;top:6px;left:calc(50% + 8px);font-size:.66rem;line-height:1.5;background:var(--uc);color:#fff;border-radius:99px;padding:0 6px}

/* sheet + toast */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(5,10,20,.45);display:none}
.scrim.open{display:block}
.sheet{position:fixed;z-index:41;left:50%;bottom:0;transform:translate(-50%,105%);width:min(560px,100%);max-height:88dvh;overflow:auto;background:var(--surface);border-radius:22px 22px 0 0;padding:18px 18px calc(18px + var(--safe-b));transition:transform .25s ease}
.sheet.open{transform:translate(-50%,0)}
.sheet .grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:-6px auto 12px}
.toast{position:fixed;z-index:50;left:50%;bottom:calc(var(--nav-h) + var(--safe-b) + 14px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;box-shadow:0 10px 30px -10px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .2s;max-width:calc(100% - 32px)}
.toast.show{opacity:1}
.toast button{margin-left:10px;border:0;background:none;color:inherit;text-decoration:underline;font-weight:800}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">Megacracks<small>26/27</small></div>
    <span class="sync" id="sync" title="Sincronización"></span>
    <div class="users" id="users" role="group" aria-label="Coleccionista"></div>
  </div>
</header>

<main class="wrap" id="main"></main>

<nav class="tabs" aria-label="Secciones">
  <div class="wrap" id="tabs"></div>
</nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast" role="status"></div>

<script src="/data.js"></script>
<script src="/app.js"></script>
</body>
</html>
